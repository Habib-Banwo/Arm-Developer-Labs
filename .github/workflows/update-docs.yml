name: Update Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  update-docs:
    runs-on: ubuntu-latest

    steps:
    # -------------------------------------------------
    # 1 - checkout repository
    # -------------------------------------------------
    - uses: actions/checkout@v4

    # -------------------------------------------------
    # 2 - Python toolchain
    # -------------------------------------------------
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # -------------------------------------------------
    # 3 - build docs and run tests
    # -------------------------------------------------
    - name: Build docs and run tests
      run: |
        cd scripts
        python -m venv .venv
        source .venv/bin/activate
        pip install -r requirements.txt
        python update_docs.py
        python update_navigation.py
        pytest ../test/test_metadata.py
        cd ..

    # -------------------------------------------------
    # 4 - verify generated docs are committed
    # -------------------------------------------------
    - name: Check regenerated docs are up to date
      run: |
        git add -A
        git restore --staged docs/_data/navigation.yml
        git restore docs/_data/navigation.yml

        if ! git diff --cached --quiet; then
          echo "Generated documentation is out of date."
          echo
          echo "Run the documentation generation scripts locally:"
          echo
          echo "  cd scripts"
          echo "  source .venv/bin/activate"
          echo "  python update_docs.py"
          echo "  python update_navigation.py"
          echo
          echo "Then commit the resulting changes and push them."
          echo
          echo "Files changed by documentation generation:"
          git diff --cached --stat
          exit 1
        fi

        echo "Generated documentation is up to date."
